spring.application.name=userservice

spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=userinfo-consumer-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.topic-json.name=userinfo_json
spring.kafka.consumer.properties.spring.json.type.mapping=auth:com.userservice.entities.UserInfoDto

spring.datasource.url=jdbc:mysql://localhost:3306/authservice?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=springuser
spring.datasource.password=springboot
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create
#spring.jpa.properties.hibernate.hbm2ddl.auto=update
server.port=9810

logging.level.org.springframework.security=DEBUG
logging.level.your.package.name=DEBUG
