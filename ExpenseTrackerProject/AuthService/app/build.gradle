plugins {
//    id 'org.springframework.boot'
    id 'application'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

ext{
    lombokVersion = "1.18.30"
}

dependencies {
    // Use JUnit test framework.
    testImplementation libs.junit

    // This dependency is used by the application.
    implementation libs.guava
    implementation group: 'org.springframework.cloud', name: 'spring-cloud-starter-bootstrap', version: '5.0.1'
    implementation group: 'org.springframework.boot', name: 'spring-boot-starter-web', version: '4.0.6'
    implementation group: 'org.springframework.boot', name: 'spring-boot-starter-actuator', version: '4.0.6'
    implementation group: 'org.springframework.boot', name: 'spring-boot-starter-data-jpa', version: '4.0.6'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server:4.0.6'
    implementation 'org.springframework.boot:spring-boot-starter-security:4.0.6'
    implementation 'org.modelmapper:modelmapper:3.2.6'
    implementation 'mysql:mysql-connector-java:8.0.33'
    compileOnly group: 'org.projectlombok', name:'lombok', version: "$lombokVersion"
    annotationProcessor group: 'org.projectlombok', name: 'lombok', version: "$lombokVersion"
    testAnnotationProcessor group: 'org.projectlombok', name: 'lombok', version: "$lombokVersion"
    testImplementation group: 'org.projectlombok', name: 'lombok', version: "$lombokVersion"
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    implementation 'io.jsonwebtoken:jjwt-impl:0.12.5'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.12.5'
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'org.example.App'
}
